<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FabricFlow Analytics | Garment Inventory Management</title>
  <meta http-equiv="refresh" content="0; url=pages/dashboard.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg-app);
      font-family: var(--font-sans);
    }
    .loading-box {
      text-align: center;
      padding: 2.5rem;
      background: #ffffff;
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border-color);
      max-width: 420px;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid var(--primary-100);
      border-top-color: var(--primary-600);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1.5rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loading-box">
    <div class="spinner"></div>
    <h2 style="font-size: 1.3rem; margin-bottom: 0.5rem;">FabricFlow Analytics</h2>
    <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 1.5rem;">Loading garment inventory overview...</p>
    <a href="pages/dashboard.html" class="btn btn-primary" style="padding: 0.6rem 1.25rem; font-size: 0.88rem;">Proceed to Dashboard &rarr;</a>
  </div>
</body>
</html>
